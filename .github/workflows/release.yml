name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install wfctl v0.63.1
        run: |
          mkdir -p "${RUNNER_TEMP}/wfctl-bin"
          curl -sSfL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o "${RUNNER_TEMP}/wfctl-bin/wfctl" \
            "https://github.com/GoCodeAlone/workflow/releases/download/v0.63.1/wfctl-linux-amd64"
          chmod +x "${RUNNER_TEMP}/wfctl-bin/wfctl"
      - name: Validate plugin contract for publish (pre-build)
        run: "${{ runner.temp }}/wfctl-bin/wfctl plugin validate-contract --for-publish --tag ${{ github.ref_name }} ."
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # workflow#765: runtime truth-check via plugin verify-capabilities.
      - name: Verify capabilities (runtime truth-check)
        run: |
          RUNNER_ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          BIN=$(jq -r --arg arch "$RUNNER_ARCH" \
            '[.[] | select(.type=="Binary" and .goos=="linux" and .goarch==$arch and (.name|startswith("workflow-plugin-salesforce")))] | .[0].path // ""' \
            dist/artifacts.json)
          if [ -z "$BIN" ] || [ "$BIN" = "null" ]; then
            echo "::warning::No matching linux/$RUNNER_ARCH binary in dist/artifacts.json; skipping verify-capabilities"
            jq '.[] | {name, type, goos, goarch, path}' dist/artifacts.json
            exit 0
          fi
          "${{ runner.temp }}/wfctl-bin/wfctl" plugin verify-capabilities --binary "$BIN" .
      - name: Publish GitHub release
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            if (release.draft) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                draft: false,
              });
            }

  sync-registry:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-release]
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check registry token
        id: registry-token
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
        run: |
          if [ -n "$REGISTRY_PAT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out plugin
        if: steps.registry-token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out workflow-registry
        if: steps.registry-token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: GoCodeAlone/workflow-registry
          token: ${{ secrets.REGISTRY_PAT }}
          path: workflow-registry

      - name: Update workflow-registry manifest
        if: steps.registry-token.outputs.present == 'true'
        run: |
          registry_dir="$GITHUB_WORKSPACE/workflow-registry"
          mkdir -p "$registry_dir/plugins/salesforce"
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          jq --arg v "$VERSION" --arg tag "$TAG" '
            .version = $v |
            .downloads = ((.downloads // []) | map(.url |= sub("/releases/download/v[^/]+/"; "/releases/download/" + $tag + "/")))
          ' "$GITHUB_WORKSPACE/plugin/plugin.json" > "$registry_dir/plugins/salesforce/manifest.json"
          cd "$registry_dir"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/salesforce/manifest.json
          git diff --cached --quiet || git commit -m "chore: sync salesforce plugin manifest v${VERSION}"
          git push

      - name: Notify workflow-registry
        if: steps.registry-token.outputs.present == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REGISTRY_PAT }}
          repository: GoCodeAlone/workflow-registry
          event-type: plugin-release
          client-payload: >-
            {"plugin": "${{ github.repository }}", "tag": "${{ github.ref_name }}"}
        continue-on-error: true
